name: Daily WLA Screener Update

on:
  schedule:
    # Läuft Mo-Fr um 21:30 UTC (22:30 MEZ / 23:30 MESZ nach US-Börsenschluss)
    - cron: '30 21 * * 1-5'
  workflow_dispatch: # Ermöglicht zusätzlich manuellen Start per Klick

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhängigkeiten installieren
        run: pip install yfinance pandas numpy

      - name: Screener-Daten & Scores berechnen
        run: python update_screener.py

      - name: Neue data.json committen
        run: |
          git config user.name "WLA Screener Bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-Update Screener Daten"
          git push
