<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AlphaPulse — Eigenständiger Aktien-Scanner</title>
  <style>
    :root {
      --bg-main: #0b1120;
      --bg-surface: #111827;
      --bg-card: #162033;
      --bg-hover: #1e293b;
      --border: #26334d;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.18);
      --accent-secondary: #06b6d4;
      --buy: #10b981;
      --hold: #f59e0b;
      --sell: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      line-height: 1.5;
      padding-bottom: 60px;
    }

    .container {
      max-width: 1380px;
      margin: 0 auto;
      padding: 24px 20px;
    }

    /* Header */
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-logo {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 18px;
      color: #06281e;
      box-shadow: 0 4px 20px var(--accent-glow);
    }

    .brand h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand p {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .sync-badge {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 12px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sync-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    /* KPI Leiste */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }

    .kpi-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 20px;
    }

    .kpi-label {
      font-size: 12px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .kpi-value {
      font-size: 26px;
      font-weight: 700;
      margin-top: 4px;
      color: var(--text-primary);
    }

    /* Filter Panel */
    .filter-panel {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 24px;
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 24px;
    }

    @media (max-width: 900px) {
      .filter-panel {
        grid-template-columns: 1fr;
      }
    }

    .filter-group {
      margin-bottom: 16px;
    }

    .filter-group:last-child {
      margin-bottom: 0;
    }

    .filter-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-secondary);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
    }

    .pill-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .pill {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 6px 13px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .pill:hover {
      border-color: var(--accent-secondary);
      color: var(--text-primary);
    }

    .pill.active {
      background: var(--accent-glow);
      border-color: var(--accent);
      color: #6ee7b7;
      font-weight: 600;
    }

    .pill span.count {
      background: rgba(255, 255, 255, 0.08);
      padding: 1px 6px;
      border-radius: 6px;
      font-size: 11px;
    }

    /* Sliders */
    .slider-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 12px;
    }

    .slider-box:last-child {
      margin-bottom: 0;
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .slider-val {
      color: var(--accent);
      font-weight: 600;
    }

    .range-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }

    /* Toolbar */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .search-input {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 10px 16px;
      border-radius: 12px;
      width: 320px;
      max-width: 100%;
      font-size: 14px;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .btn-reset {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 9px 16px;
      border-radius: 10px;
      font-size: 13px;
      cursor: pointer;
    }

    .btn-reset:hover {
      border-color: var(--text-primary);
      color: var(--text-primary);
    }

    /* Table */
    .table-wrap {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 14px;
    }

    th {
      padding: 14px 16px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }

    th:hover {
      color: var(--text-primary);
    }

    td {
      padding: 14px 16px;
      border-bottom: 1px solid rgba(38, 51, 77, 0.5);
      white-space: nowrap;
    }

    tbody tr {
      cursor: pointer;
      transition: background 0.12s ease;
    }

    tbody tr:hover {
      background: var(--bg-hover);
    }

    .stock-name {
      font-weight: 600;
      color: var(--text-primary);
    }

    .stock-sub {
      font-size: 12px;
      color: var(--text-muted);
    }

    .badge {
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      display: inline-block;
    }

    .badge-buy {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .badge-hold {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .badge-sell {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .status-chip {
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .score-bar-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .score-bar {
      width: 56px;
      height: 6px;
      background: #1e293b;
      border-radius: 999px;
      overflow: hidden;
    }

    .score-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-secondary), var(--accent));
    }

    .chance-dots {
      display: flex;
      gap: 3px;
    }

    .dot {
      width: 7px;
      height: 14px;
      border-radius: 3px;
      background: #1e293b;
    }

    .dot.filled {
      background: var(--accent);
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(5, 10, 20, 0.78);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      max-width: 680px;
      width: 100%;
      padding: 24px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 18px;
    }

    .modal-close {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-primary);
      width: 34px;
      height: 34px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 18px;
    }

    .metric-item {
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 12px;
    }

    .metric-item span {
      display: block;
      font-size: 11px;
      color: var(--text-secondary);
    }

    .metric-item strong {
      font-size: 16px;
      color: var(--text-primary);
    }

    canvas {
      width: 100%;
      height: 170px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <div class="brand-logo">AP</div>
        <div>
          <h1>Alpha
